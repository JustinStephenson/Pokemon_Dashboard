name: CI

on:
  push:
    branches: [main]
  pull_request:

# The Playwright UI tests (npm run test:ui) are not run here: some of their
# layout checks fail on the Linux runner. Run them locally instead.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit and component tests (Jest)
        run: npm run test:ci
